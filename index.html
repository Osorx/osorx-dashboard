<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSORX AI</title>
<style>
body{
margin:0;
background:#111827;
font-family:Arial, sans-serif;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.container{
width:90%;
max-width:700px;
background:#1f2937;
padding:30px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,.3);
}
.avatar{
width:150px;
height:150px;
border-radius:50%;
background:#2563eb;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
font-size:50px;
}
h1{
text-align:center;
}
#chat{
height:250px;
overflow:auto;
background:#111827;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}
input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
box-sizing:border-box;
}
button{
margin-top:10px;
padding:12px 20px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
cursor:pointer;
}
.user{
color:#60a5fa;
margin-bottom:10px;
}
.ai{
color:#34d399;
margin-bottom:10px;
}
</style>
</head>
<body>
<div class="container">
<div class="avatar">
🤖
</div>
<h1>OSORX AI</h1>
<div id="chat">
<div class="ai">
Hello. I am OSORX AI. How can I help you today?
</div>
</div>
<input
id="message"
placeholder="Type your message..."
>
<button onclick="sendMessage()">
Send
</button>
</div>
<script>
function sendMessage(){
const input =
document.getElementById("message");
const text =
input.value;
if(text === "") return;
const chat =
document.getElementById("chat");
chat.innerHTML +=
'<div class="user">You: ' +
text +
'</div>';
chat.innerHTML +=
'<div class="ai">OSORX AI: I heard "' +
text +
'". Real AI integration coming soon.</div>';
input.value = "";
chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
